name: full validation

on:
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Sync locked core development environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --python 3.14 --extra dev
      - name: Public catalog and contract tests
        run: uv run --no-sync python -m pytest -q tests/test_operate_distribution_docs.py tests/test_lite_suite.py tests/test_verify_release_integrity.py tests/test_current_cli_entrypoints.py
      - name: Runtime suite
        run: uv run --no-sync python -m pytest -q tests/
      - name: Static checks
        run: uv run --no-sync python -m ruff check .
